spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost/mercado_fipp
spring.datasource.username=postgres
# A senha NÃO fica aqui (o repositório é público). O adaptar.exe / adaptar.sh gera o arquivo abaixo,
# que fica fora do git. Também dá para usar a variável de ambiente SPRING_DATASOURCE_PASSWORD.
spring.config.import=optional:file:./application-local.properties,optional:file:./backend/application-local.properties
# Fotos dos anúncios: gravadas em backend/uploads/fotos e servidas em http://localhost:8080/fotos/{fot_file}
spring.web.resources.static-locations=classpath:/static/,file:uploads/
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB
