spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost/mercado_fipp
spring.datasource.username=postgres
spring.config.import=optional:file:./application-local.properties,optional:file:./backend/application-local.properties
# Fotos dos anuncios: gravadas em backend/uploads/fotos e servidas em http://localhost:8080/fotos/{fot_file}
spring.web.resources.static-locations=classpath:/static/,file:uploads/
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB
