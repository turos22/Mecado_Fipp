<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar · Mercado FIPP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
          integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
          integrity="sha384-nWN3KqaaVcbEsCjLSV+2jMjh62Iny/+mN3srM8TZeM8N6aj7eDl5wwYggjAJ4/sJ" crossorigin="anonymous">
    <link rel="stylesheet" href="../estilo/estilo.css">
</head>
<body class="fundo-login">
<main class="container min-vh-100 d-flex align-items-center py-4">
    <div class="card cartao-login shadow-lg w-100 mx-auto overflow-hidden">
        <div class="row g-0">
            <section class="col-md-5 painel-marca text-white p-4 p-md-5 d-flex flex-column justify-content-center">
                <i class="bi bi-bag-heart-fill display-3 mb-3"></i>
                <h1 class="h2 fw-bold">Mercado FIPP</h1>
                <p class="mb-0">Compre e venda entre alunos da FIPP: livros, computadores, acessórios e muito mais.</p>
            </section>
            <section class="col-md-7 p-4 p-md-5">
                <h2 class="h4 mb-1">Entrar</h2>
                <p class="text-muted">Use o seu usuário e senha para ver os anúncios.</p>

                <div id="mensagem" aria-live="polite"></div>

                <form id="form-login" class="mt-3" novalidate>
                    <div class="mb-3">
                        <label for="usuario" class="form-label">Usuário</label>
                        <div class="input-group has-validation">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input id="usuario" type="text" class="form-control form-control-lg" autocomplete="username" required autofocus>
                            <div class="invalid-feedback">Informe o usuário.</div>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="senha" class="form-label">Senha</label>
                        <div class="input-group has-validation">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input id="senha" type="password" class="form-control form-control-lg" autocomplete="current-password" required>
                            <div class="invalid-feedback">Informe a senha.</div>
                        </div>
                    </div>
                    <button id="btn-entrar" type="submit" class="btn btn-mf btn-lg w-100">Entrar</button>
                </form>
            </section>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
<script src="../js/config.js"></script>
<script src="../js/util.js"></script>
<script src="../js/sessao.js"></script>
<script src="../js/http.js"></script>
<script src="../js/controller/autenticacaoController.js"></script>
<script src="../js/paginas/login.js"></script>
</body>
</html>
