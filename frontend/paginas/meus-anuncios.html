<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meus anúncios · Mercado FIPP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
          integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
          integrity="sha384-nWN3KqaaVcbEsCjLSV+2jMjh62Iny/+mN3srM8TZeM8N6aj7eDl5wwYggjAJ4/sJ" crossorigin="anonymous">
    <link rel="stylesheet" href="../estilo/estilo.css">
</head>
<body>
<header id="cabecalho"></header>

<main class="container py-4">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
        <div>
            <h1 class="h3 fw-bold mb-0">Meus anúncios</h1>
            <p class="text-muted mb-0">Só você vê esta área. Aqui dá para corrigir título, descrição, preço e categoria.</p>
        </div>
    </div>

    <div id="aviso" class="mb-3" aria-live="polite"></div>
    <div id="lista" class="row row-cols-1 row-cols-md-2 g-3"></div>
</main>

<!-- Edição de um anúncio -->
<div class="modal fade" id="modal-editar" tabindex="-1" aria-labelledby="titulo-modal-editar" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <form id="form-editar" class="modal-content" novalidate>
            <div class="modal-header">
                <h2 class="modal-title h5" id="titulo-modal-editar">Editar anúncio</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="campo-titulo" class="form-label">Título</label>
                    <input id="campo-titulo" class="form-control" maxlength="80" required>
                    <div class="invalid-feedback">Informe o título (até 80 caracteres).</div>
                </div>
                <div class="mb-3">
                    <label for="campo-categoria" class="form-label">Categoria</label>
                    <select id="campo-categoria" class="form-select" required></select>
                    <div class="invalid-feedback">Escolha uma categoria.</div>
                </div>
                <div class="mb-3">
                    <label for="campo-preco" class="form-label">Preço (R$)</label>
                    <input id="campo-preco" type="number" class="form-control" min="0" max="999999999.9" step="0.1" required>
                    <div class="invalid-feedback">Informe um preço entre 0 e 999.999.999,9.</div>
                </div>
                <div class="mb-3">
                    <label for="campo-descricao" class="form-label">Descrição</label>
                    <textarea id="campo-descricao" class="form-control" rows="4"></textarea>
                </div>
                <div id="erro-edicao" aria-live="polite"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button id="btn-salvar" type="submit" class="btn btn-mf">Salvar</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
<script src="../js/config.js"></script>
<script src="../js/util.js"></script>
<script src="../js/sessao.js"></script>
<script src="../js/http.js"></script>
<script src="../js/cabecalho.js"></script>
<script src="../js/controller/anuncioController.js"></script>
<script src="../js/paginas/meus-anuncios.js"></script>
</body>
</html>
