<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Categorias · Mercado FIPP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
          integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
          integrity="sha384-nWN3KqaaVcbEsCjLSV+2jMjh62Iny/+mN3srM8TZeM8N6aj7eDl5wwYggjAJ4/sJ" crossorigin="anonymous">
    <link rel="stylesheet" href="../estilo/estilo.css">
</head>
<body>
<header id="cabecalho"></header>

<main class="container py-4">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
        <div>
            <h1 class="h3 fw-bold mb-0">Categorias</h1>
            <p class="text-muted mb-0">Área do administrador. Categoria com anúncios não pode ser excluída.</p>
        </div>
        <button id="btn-nova" type="button" class="btn btn-mf"><i class="bi bi-plus-lg me-1"></i>Nova categoria</button>
    </div>

    <div id="aviso" class="mb-3" aria-live="polite"></div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th scope="col" style="width: 5rem">#</th>
                        <th scope="col">Nome</th>
                        <th scope="col" class="text-end">Ações</th>
                    </tr>
                </thead>
                <tbody id="lista"></tbody>
            </table>
        </div>
    </div>
</main>

<!-- Criar ou editar uma categoria (o mesmo formulário serve para os dois) -->
<div class="modal fade" id="modal-categoria" tabindex="-1" aria-labelledby="titulo-modal-categoria" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <form id="form-categoria" class="modal-content" novalidate>
            <div class="modal-header">
                <h2 class="modal-title h5" id="titulo-modal-categoria">Nova categoria</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="campo-nome" class="form-label">Nome</label>
                    <input id="campo-nome" class="form-control" maxlength="20" required autocomplete="off">
                    <div class="invalid-feedback">Informe o nome (até 20 caracteres).</div>
                </div>
                <div id="erro-categoria" aria-live="polite"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button id="btn-salvar" type="submit" class="btn btn-mf">Salvar</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
<script src="../js/config.js"></script>
<script src="../js/util.js"></script>
<script src="../js/sessao.js"></script>
<script src="../js/http.js"></script>
<script src="../js/cabecalho.js"></script>
<script src="../js/controller/categoriaController.js"></script>
<script src="../js/paginas/categorias.js"></script>
</body>
</html>
